name: CI

on:
  push:
  pull_request:

env:
  NEXT_PUBLIC_LAMORIMPROMOS_CONVERT_URL: https://lamorimpromos-n8n-edge.lamorimverso.workers.dev/webhook/lamorimpromos/site/v1/convert

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
